services:
  - type: web
    name: pipecat-bot
    env: docker
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PIPECAT_CLOUD_API_KEY
        sync: false
      - key: AGENT_ID
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
