services:
  - type: web
    name: pipecat-api
    env: python
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PIPECAT_CLOUD_API_KEY
        sync: false
      - key: AGENT_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
